# Everything on /cv.html comes from this file. Edit here, not in the layout.
# Rules:
# - Keep every value in double quotes, and never type a double quote inside one.
# - Indent with spaces, never tabs.
# - Plain text only. Any HTML is escaped and shows as text.
# - Links must start with https://, mailto:, or / (a page on this site).
#   Anything else (http://, javascript:) shows as plain text, not a link.
# - This file is public. No phone number, home address, or personal email.
# - A header link can show a small icon: icon: "web", "code" or "person".
#   Leave the icon line out for no icon.
# - A job can list "highlights": each one a bold label plus its text, shown
#   under highlights_title. Plain one-line "bullets" still work as well.
# - Don't type the separators. The page adds " | " before each date and
#   " - " before a school or certification issuer.
# - Optional: a motto: line under title shows a quote under your name.

