summary:
  - "Network and Security Specialist working since 2015 across enterprise, hospitality, and regulated gaming networks in Singapore and Canada. Most of that time has gone into segmentation, firewall policy, and change control, and into coordinating the network side when something breaks anyway."
  - "Day to day that means Palo Alto and Cisco, multi-vendor wireless, and Python and Ansible for the repetitive work. Anything new goes through a lab first, and AI gets read access, never write."

