projects:
  - title: "Terminal Agents for Infrastructure"
    role: "Flagship · In progress"
    focus: "ai cloud security automation"
    size: "wide"
    style: "inverted"
    description: "Terminal coding agents get far more useful when they can drive the same CLI tools I use for infrastructure, network, security, and observability. The rule is simple. The agent proposes, a person reviews and merges, and CI applies. Built on AWS from scratch, doubling as practice for the Solutions Architect exam."
    stack: ["Coding Agents", "CLI Tooling", "AWS", "Infrastructure as Code", "CI", "Human Approval"]

  - title: "Network Automation Toolkit"
    role: "Open source · Python"
    focus: "automation network security"
    description: "Config backup with drift detection, pre and post change validation, STIG-style compliance audits, and NetBox sync on one Netmiko layer. Anything that writes is a dry run until I add an explicit apply flag."
    stack: ["Python", "Netmiko", "Typer CLI", "NetBox", "Drift Detection", "STIG Audit"]
    links:
      - label: "Repository"
        url: "https://github.com/archievizt/netops-automation"
      - label: "Write-up"
        url: "/netops-automation/"

  - title: "Hybrid Cloud on Google Cloud Platform"
    role: "Lab · Infrastructure as code"
    focus: "cloud network security automation"
    size: "half"
    description: "OPNsense and VyOS each hold a route-based IKEv2 tunnel to one Google Cloud HA VPN gateway, with eBGP across three autonomous systems and route filtering both ways. Default-deny on both routers, no public IP on the cloud VM, and the hand-built cloud side imported into Terraform behind a zero-destroy plan gate."
    stack: ["IPsec VTI", "eBGP", "HA VPN", "Cloud Router", "OPNsense", "VyOS", "Terraform", "IAP"]

  - title: "On-call Triage Agent"
    role: "AI · In progress"
    focus: "ai observability"
    size: "half"
    style: "inverted"
    description: "Takes a Grafana alert, gathers evidence with read-only tools, and writes a triage note for a person to act on. Runs on Claude or a local model, with a fixtures mode so it can be demoed without touching anything real."
    stack: ["Python", "FastAPI", "Grafana Webhooks", "Read-only Tools", "Claude", "Ollama"]

  - title: "EVPN Fabric with External L3Out"
    role: "Lab · Data centre"
    focus: "network"
    description: "Nexus 9000v spines as iBGP route reflectors over an OSPF underlay, each tenant handed to an IOS-XE router on its own VRF-Lite eBGP session, and a fifteen-point runbook through live border failover."
    stack: ["VXLAN", "EVPN", "iBGP RR", "VRF-Lite", "Nexus 9000v", "EVE-NG"]
    links:
      - label: "Repository"
        url: "https://github.com/archievizt/evpn-vxlan-l3out-lab"

  - title: "Cisco Catalyst SD-WAN"
    role: "Lab · Study"
    focus: "network"
    description: "A structured run through the Cisco DevNet sandboxes on vManage 20.18, with phase guides, architecture diagrams, and a Python baseline collector."
    stack: ["SD-WAN", "vManage", "Python", "DevNet"]

  - title: "Local AI Node"
    role: "Lab · Research"
    focus: "ai observability"
    description: "Ollama, Open WebUI, and Qdrant on my own hardware, for research into local models that watch a network without touching it."
    stack: ["Ollama", "Open WebUI", "Qdrant", "RAG"]

how_i_work:
  - title: "Automation that runs itself."
    text: "Python and Ansible handle the toil, so I never babysit a CLI for the same task twice."
  - title: "Agents propose, people decide."
    text: "Coding agents and triage agents get the tools and the evidence. A person still makes the call."
  - title: "Hybrid cloud as code."
    text: "My lab reaches Google Cloud over two IPsec tunnels with BGP on top, and one Terraform variable tears the tunnels down when I'm done."
  - title: "Aggressive segmentation."
    text: "Every segment walled off from the rest. Default-deny or it didn't happen."
  - title: "Self-hosted AI."
    text: "Local models on my own hardware, tuned where the cloud can't watch."
  - title: "Breaking my own lab."
    text: "I go looking for the weak spots before anyone else does. Better a quiet Tuesday than a Friday night."

