  - id: "local-ai-node"
    title: "Local AI Node"
    role: "Lab · Research"
    focus: "ai observability"
    description: "Ollama, Open WebUI, and Qdrant on my own hardware, for research into local models that watch a network without touching it."
    stack: ["Ollama", "Open WebUI", "Qdrant", "RAG"]
    tagline: "Local models that read the network and reason about it out loud, with no write path."
    my_role: "Builder"
    status: "Research"
    sections:
