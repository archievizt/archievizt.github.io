how_i_work:
  - title: "Automation that runs itself."
    text: "Python and Ansible handle the toil, so I never babysit a CLI for the same task twice."
  - title: "Agents propose, people decide."
    text: "Coding agents and triage agents get the tools and the evidence. A person still makes the call."
  - title: "Hybrid cloud as code."
    text: "My lab reaches Google Cloud over two IPsec tunnels with BGP on top, and one Terraform variable tears the tunnels down when I'm done."
  - title: "Aggressive segmentation."
    text: "Every segment walled off from the rest. Default-deny or it didn't happen."
  - title: "Self-hosted AI."
    text: "Local models on my own hardware, tuned where the cloud can't watch."
  - title: "Breaking my own lab."
    text: "I go looking for the weak spots before anyone else does. Better a quiet Tuesday than a Friday night."


