# Everything on the home page comes from this file. Edit here, not in the layout.
# Same rules as _data/cv.yml:
# - Keep every value in double quotes, and never type a double quote inside one.
# - Indent with spaces, never tabs. Plain text only; any HTML shows as text.
# - Links must start with https://, mailto:, or / (a page on this site).
# Project cards:
# - focus: one or more of ai, cloud, network, security, architecture, automation, observability
#   (space separated). They drive the "Explore by focus" buttons.
# - size: "wide" (two thirds of a row), "half", or leave it out (one third).
# - style: "inverted" swaps the card colours to make it stand out.
# - id: a short name with letters, numbers and hyphens only. It names the
#   pop-up (archievizt.github.io/#p-<id>), so keep it unique.
# - Clicking a card opens a "Behind the project" pop-up built from tagline,
#   status, flow (one line per step), stats, sections, and links.

