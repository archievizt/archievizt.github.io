# Site identity. The title shows at the top of the left sidebar. The
# description is not shown on the page: search engines and link previews use it.
title: Archie Abeleda
tagline: Network and Security Specialist
description: >-
  Network and Security Specialist. Over a decade on high-stakes networks,
  plus a lab where local AI gets read access only.
author: Archie Abeleda
lang: en-CA

url: https://archievizt.github.io
baseurl: ""

# The rest of the left sidebar, under the title, in this order: the intro, the
# links and the status line. Optional extras:
#   ID lines under the title:  id: "Armando Abeleda Jr."  and  run_as: "Archie"
#   a quote after the intro:   motto: "Paranoid by trade, boring by design."
# Rules:
# - Keep every value in double quotes, and never type a double quote inside one.
# - Plain text only. Any HTML is escaped and shows as text.
# - Links must start with https://, mailto:, or / (a page on this site).
#   Anything else (http://, javascript:) shows as plain text, not a link.
# - Delete a line to hide it. Delete a "- label" line and its "url" line to drop a link.
sidebar:
  intro: "Over a decade keeping high-stakes networks locked down and online. Belt and braces on every layer. Now I point the same paranoia at my own kit."
  status: "Systems Operational"
  links:
    - label: "CV"
      url: "/cv.html"
    - label: "GitHub"
      url: "https://github.com/archievizt"
    - label: "LinkedIn"
      url: "https://www.linkedin.com/in/ajrabeleda"
    - label: "Email"
      url: "mailto:hello@archieabeleda.dev"

social:
  name: Archie Abeleda
  links:
    - https://github.com/archievizt
    - https://www.linkedin.com/in/ajrabeleda

# Same theme as the reference site. GitHub Pages builds it natively.
theme: jekyll-theme-minimal

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Repo housekeeping that should not end up on the site. Jekyll also skips
# anything starting with a dot (.env, .env.example, .gitignore) by default.
exclude:
  - README.md
  - SECURITY.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - .jekyll-cache
